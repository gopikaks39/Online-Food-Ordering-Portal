apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodie-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: foodie
      slot: blue
  template:
    metadata:
      labels:
        app: foodie
        slot: blue
    spec:
      containers:
        - name: foodie
          image: gopikaks/online-food-ordering-portal:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodie-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: foodie
      slot: green
  template:
    metadata:
      labels:
        app: foodie
        slot: green
    spec:
      containers:
        - name: foodie
          image: gopikaks/online-food-ordering-portal:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: foodie-service
spec:
  type: NodePort
  selector:
    app: foodie
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30012
